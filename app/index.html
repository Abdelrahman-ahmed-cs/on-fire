<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>On Fire — harmonized burning activity</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23ff6a1f' d='M32 4c4 10 18 17 18 33a18 18 0 0 1-36 0c0-9 5-15 9-21 1 6 4 9 7 10-1-8-1-15 2-22z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- inline SVG icon set: one stroke weight, drawn for this app -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 3c1.6 3.4 6 5.6 6 10.6A6 6 0 0 1 6 13.6c0-2.9 1.6-4.8 3-6.6.4 2 1.3 3 2.3 3.3C11 7.8 11 5.3 12 3Z"/><path d="M12 14.5c.8 1.3 2.2 2 2.2 3.6a2.2 2.2 0 0 1-4.4 0c0-1 .6-1.7 1.1-2.4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></symbol>
    <symbol id="i-split" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M12 2.5v19"/><path d="m8.5 10-2 2 2 2M15.5 10l2 2-2 2"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5Z"/><path d="M12 6v13.5"/></symbol>
    <symbol id="i-sensors" viewBox="0 0 24 24"><circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 4 3 9l9 5 9-5Z"/><path d="m3 14 9 5 9-5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5c-2.6-2.4-3.8-5.2-3.8-8.5s1.2-6.1 3.8-8.5Z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5Z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5.5v13M16 5.5v13" stroke-width="3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v5.5M12 16.2v.3"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4Z"/><path d="M12 10v4.5M12 17v.3"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="m3.5 16.5 6-6 4 4 7-7"/><path d="M15 7.5h5.5V13"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.4M12 16.6v.3"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5Z"/><path d="M13.5 7l3 3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M4.5 19.5h15"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-flare" viewBox="0 0 24 24"><path d="M8 21V11h8v10"/><path d="M12 11V8"/><path d="M12 2.5c1.5 1.6 2.2 2.8 2.2 4A2.2 2.2 0 0 1 9.8 6.5c0-.8.4-1.5 1-2.2"/></symbol>
    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M10.5 13.5 3 11l1.5-1.5 7.5 1L16.5 6a2.1 2.1 0 0 1 3 3L15 13.5l1 7.5-1.5 1.5-2.5-7.5-3.5 3.5V21l-1.5 1.5-1-4-4-1L3 16h2.5Z"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
  </defs>
</svg>

<!-- LOADING SCREEN -->
<div id="loader" role="status" aria-live="polite">
  <div class="loader-glow" aria-hidden="true"></div>
  <div class="loader-embers" aria-hidden="true"></div>
  <div class="logo3d" id="loader-logo" data-size="148" data-depth="18"></div>
  <div class="loader-word">ON FIRE</div>
  <div class="loader-sub">Twenty-five years of satellite fire, in one record</div>
  <div class="loader-bar"><i id="loader-fill"></i></div>
  <div class="loader-step" id="loader-step">Starting</div>
</div>

<header id="topbar">
  <a class="brand" href="#" aria-label="On Fire, home">
    <span class="logo3d" id="brand-logo" data-size="40" data-depth="7"></span>
    <span class="brand-text"><b>ON FIRE</b><small>MODIS + VIIRS fire record</small></span>
  </a>
  <nav id="nav" aria-label="Sections">
    <button data-view="truth" class="active"><svg class="ic"><use href="#i-split"/></svg><span>Truth vs Prediction</span></button>
    <button data-view="docs"><svg class="ic"><use href="#i-book"/></svg><span>Documentation</span></button>
  </nav>
  <div class="top-tools">
    <span class="clock mono" id="clock">UTC --:--:--</span>
    <label class="icon-btn" title="Colour-blind palette"><input type="checkbox" id="cvd" class="sr"><svg class="ic"><use href="#i-eye"/></svg><span class="sr">Colour-blind palette</span></label>
    <span class="status-pill"><i class="dot-ok"></i><span id="data-status">FIRMS archive</span></span>
  </div>
</header>

<main>
  <!-- TRUTH VS PREDICTION -->
  <section id="view-truth" class="view">
    <div id="tv-stage" class="glass-frame">
      <div id="tv-real" class="tv-map"></div>
      <div id="tv-pred" class="tv-map"></div>
      <div id="tv-scan" aria-hidden="true"></div>
      <div id="tv-line" aria-hidden="true"><span class="tv-knob"><svg class="ic sm"><use href="#i-left"/></svg><svg class="ic sm"><use href="#i-right"/></svg></span></div>
      <div class="map-caption"><span class="tag">Backtest</span><span id="tv-phase">Left: the risk the frozen model gave. Right: what actually burned.</span></div>
      <span class="tv-side-label l">Predicted risk</span><span class="tv-side-label r">What burned</span>
      <div id="tv-bar">
        <button id="tv-play" class="play" aria-label="Pause"><svg class="ic"><use href="#i-pause"/></svg></button>
        <div id="tv-fires" class="tv-fires" role="tablist" aria-label="Fire"></div>
      </div>
      <div id="tv-legend" class="legend-float"></div>
    </div>
    <aside id="tv-side" aria-label="Backtest result"></aside>
  </section>

  <!-- DOCUMENTATION -->
  <section id="view-docs" class="view scroll">
    <div id="docs"></div>
  </section>
</main>
<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
